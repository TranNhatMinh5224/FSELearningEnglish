name: Deploy Backend (VPS)

on:
  push:
    branches: [ main ]
    paths:
      - 'BackendELearningEnglish/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: '8.0.x'
      BACKEND_PROJECT: 'BackendELearningEnglish/LearningEnglish.API/LearningEnglish.API.csproj'
      PUBLISH_DIR: 'publish_backend'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.BACKEND_PROJECT }}"

      - name: Build
        run: dotnet build "${{ env.BACKEND_PROJECT }}" -c Release --no-restore

      - name: Publish
        run: dotnet publish "${{ env.BACKEND_PROJECT }}" -c Release -o "${{ env.PUBLISH_DIR }}" --no-build

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Ensure backend directory exists
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
          "mkdir -p ${{ secrets.VPS_BACKEND_PATH }}"

      - name: Upload backend (rsync)
        run: |
          rsync -az \
            -e "ssh -o StrictHostKeyChecking=no" \
            "${{ env.PUBLISH_DIR }}/" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_BACKEND_PATH }}/"

      - name: Restart backend service
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
          "sudo systemctl restart ${{ secrets.VPS_BACKEND_SERVICE }} && sudo systemctl is-active ${{ secrets.VPS_BACKEND_SERVICE }}"