name: Deploy Backend (VPS)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*.*.*' # Chỉ chạy khi push tag có định dạng v1.0.0, v2.1.3...
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write

    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
      DOTNET_VERSION: '8.0.x'
      BACKEND_PROJECT: 'BackendELearningEnglish/LearningEnglish.API/LearningEnglish.API.csproj'
      PUBLISH_DIR: 'publish_backend'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.BACKEND_PROJECT }}"

      - name: Build
        run: dotnet build "${{ env.BACKEND_PROJECT }}" -c Release --no-restore

      - name: Publish
        run: dotnet publish "${{ env.BACKEND_PROJECT }}" -c Release -o "${{ env.PUBLISH_DIR }}" --no-build

      - name: Install EF Tool
        run: |
          dotnet tool install --global dotnet-ef --version 8.* || dotnet tool update --global dotnet-ef --version 8.*
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Generate Migration Bundle
        run: |
          dotnet ef migrations bundle \
            --project BackendELearningEnglish/LearningEnglish.Infrastructure \
            --startup-project BackendELearningEnglish/LearningEnglish.API \
            --runtime linux-x64 \
            --self-contained \
            -o "${{ env.PUBLISH_DIR }}/efbundle"

      - name: Validate deploy secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.VPS_BACKEND_PATH }}" ] || [ -z "${{ secrets.VPS_BACKEND_SERVICE }}" ]; then
            echo "::error::Missing VPS_BACKEND_PATH and/or VPS_BACKEND_SERVICE secret(s)."
            exit 1
          fi

      - name: Deploy backend to target path (local)
        shell: bash
        run: |
          sudo -n rsync -a --delete \
            --exclude="appsettings.Production.json" \
            --exclude=".env" \
            --mkpath "${{ env.PUBLISH_DIR }}/" "${{ secrets.VPS_BACKEND_PATH }}/"

      - name: Restart backend service
        shell: bash
        run: |
          sudo -n systemctl daemon-reload
          sudo -n systemctl restart "${{ secrets.VPS_BACKEND_SERVICE }}"
          sudo -n systemctl is-active "${{ secrets.VPS_BACKEND_SERVICE }}"

      - name: Run Database Migrations
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          cd "${{ secrets.VPS_BACKEND_PATH }}"
          sudo -n chmod +x efbundle
          # Chạy bundle để update DB (nó sẽ tự đọc appsettings.Production.json nhờ biến môi trường trên)
          ./efbundle
