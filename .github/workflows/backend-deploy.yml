name: Deploy Backend (VPS)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
    paths:
      - 'BackendELearningEnglish/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64]

    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
      DOTNET_VERSION: '8.0.x'
      BACKEND_PROJECT: 'BackendELearningEnglish/LearningEnglish.API/LearningEnglish.API.csproj'
      PUBLISH_DIR: 'publish_backend'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.BACKEND_PROJECT }}"

      - name: Build
        run: dotnet build "${{ env.BACKEND_PROJECT }}" -c Release --no-restore

      - name: Publish
        run: dotnet publish "${{ env.BACKEND_PROJECT }}" -c Release -o "${{ env.PUBLISH_DIR }}" --no-build

      - name: Validate deploy secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.VPS_BACKEND_PATH }}" ] || [ -z "${{ secrets.VPS_BACKEND_SERVICE }}" ]; then
            echo "::error::Missing VPS_BACKEND_PATH and/or VPS_BACKEND_SERVICE secret(s)."
            exit 1
          fi

      - name: Deploy backend to target path (local)
        shell: bash
        run: |
          sudo -n mkdir -p "${{ secrets.VPS_BACKEND_PATH }}"
          sudo -n rsync -a --delete "${{ env.PUBLISH_DIR }}/" "${{ secrets.VPS_BACKEND_PATH }}/"

      - name: Restart backend service
        shell: bash
        run: |
          sudo -n systemctl daemon-reload
          sudo -n systemctl restart "${{ secrets.VPS_BACKEND_SERVICE }}"
          sudo -n systemctl is-active "${{ secrets.VPS_BACKEND_SERVICE }}"