name: Deploy Frontend (VPS)

on:
  push:
    branches: [ main ]
    paths:
      - 'FrontElearningEnglish/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FrontElearningEnglish

    env:
      NODE_VERSION: '20'
      BUILD_DIR: 'build'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FrontElearningEnglish/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Upload frontend (rsync)
        run: |
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            "FrontElearningEnglish/${{ env.BUILD_DIR }}/" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_FRONTEND_PATH }}/"

      - name: Reload nginx
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo systemctl reload nginx && sudo systemctl status nginx --no-pager -l"
