name: Deploy Frontend (VPS)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
    paths:
      - 'FrontElearningEnglish/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64]

    defaults:
      run:
        working-directory: FrontElearningEnglish

    env:
      NODE_VERSION: '22'
      BUILD_DIR: 'build'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FrontElearningEnglish/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          CI: 'false'
        run: npm run build

      - name: Validate deploy secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.VPS_FRONTEND_PATH }}" ]; then
            echo "::error::Missing VPS_FRONTEND_PATH secret."
            exit 1
          fi

      - name: Deploy frontend to web root (local)
        shell: bash
        run: |
          sudo -n mkdir -p "${{ secrets.VPS_FRONTEND_PATH }}"
          sudo -n rsync -a --delete "${{ env.BUILD_DIR }}/" "${{ secrets.VPS_FRONTEND_PATH }}/"

      - name: Reload Nginx
        shell: bash
        run: |
          sudo -n systemctl reload nginx
          sudo -n systemctl is-active nginx