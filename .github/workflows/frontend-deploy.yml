name: Deploy Frontend (VPS)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*.*.*' # Chỉ chạy khi push tag có định dạng v1.0.0, v2.1.3...
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write

    defaults:
      run:
        working-directory: FrontElearningEnglish

    env:
      NODE_VERSION: '22'
      BUILD_DIR: 'build'

    steps:
      - name: Set environment variables
        run: |
          echo "REACT_APP_API_BASE_URL=${{ secrets.REACT_APP_API_BASE_URL }}" >> $GITHUB_ENV
          echo "REACT_APP_FACEBOOK_APP_ID=${{ secrets.REACT_APP_FACEBOOK_APP_ID }}" >> $GITHUB_ENV
          echo "REACT_APP_FACEBOOK_REDIRECT_URI=${{ secrets.REACT_APP_FACEBOOK_REDIRECT_URI }}" >> $GITHUB_ENV
          echo "REACT_APP_GOOGLE_CLIENT_ID=${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "REACT_APP_GOOGLE_REDIRECT_URI=${{ secrets.REACT_APP_GOOGLE_REDIRECT_URI }}" >> $GITHUB_ENV
          echo "REACT_APP_GA_MEASUREMENT_ID=${{ secrets.REACT_APP_GA_MEASUREMENT_ID }}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FrontElearningEnglish/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        env:
          CI: 'false'
        run: npm run build

      - name: Validate deploy secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.VPS_FRONTEND_PATH }}" ]; then
            echo "::error::Missing VPS_FRONTEND_PATH secret."
            exit 1
          fi

      - name: Deploy frontend to web root (local)
        shell: bash
        run: |
          sudo -n rsync -a --delete \
            --exclude=".env" \
            --mkpath "${{ env.BUILD_DIR }}/" "${{ secrets.VPS_FRONTEND_PATH }}/"

      - name: Reload Nginx
        shell: bash
        run: |
          sudo -n systemctl reload nginx
          sudo -n systemctl is-active nginx
