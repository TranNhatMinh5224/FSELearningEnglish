name: Deploy Frontend (VPS)

on:
  push:
    branches: [ main ]
    paths:
      - 'FrontElearningEnglish/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FrontElearningEnglish

    env:
      NODE_VERSION: '20'
      BUILD_DIR: 'build'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FrontElearningEnglish/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Prepare remote temp directory
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p ~/deploy_tmp/frontend"

      - name: Upload frontend (rsync)
        run: |
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            "${{ env.BUILD_DIR }}/" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/deploy_tmp/frontend/"

      - name: Promote build to web root
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            sudo -n rsync -a --delete ~/deploy_tmp/frontend/ ${{ secrets.VPS_FRONTEND_PATH }}/
          "

      - name: Reload Nginx
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            sudo -n systemctl reload nginx
            sudo -n systemctl is-active nginx
          "