services:
  postgres:
    image: ankane/pgvector:latest
    container_name: elearning-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "05022004"
      POSTGRES_DB: "ElearningEnglish2004"
    ports:
      # Use 5433 to avoid conflict with a locally-installed Postgres on 5432
      - "5433:5432"
    volumes:
      - elearning_pgdata:/var/lib/postgresql/data

  # Object Storage (MinIO)
  minio:
    image: minio/minio
    container_name: elearning-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: server /data --console-address ":9001"
    volumes:
      - elearning_miniodata:/data

volumes:
  elearning_pgdata:
  elearning_miniodata:
